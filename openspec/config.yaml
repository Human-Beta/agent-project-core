schema: spec-driven
context: |
  Language: English. Write all artifacts in English.
  agent-project-core is a standalone, stack-independent repository for WF-02 from the Movie Match workflow roadmap.
  WF-02 owns shared guidance, reusable skills, native Codex/Claude adapters, and a bounded way to export them for future templates.
  Stack templates (WF-03/04), automated update PRs (WF-05), Movie Match adoption (WF-06/07), and real deployment (WF-08) remain out of scope.
  This bootstrap has no reusable core implementation or accepted capability specs yet.
  Use the pinned local CLI through pnpm exec openspec. Run pnpm verify before publishing a planning batch.
rules:
  proposal:
    - Separate the repository bootstrap from the proposed reusable core; do not claim planned behavior exists.
  design:
    - Ground tool adapters in official documentation and keep native syntax separate from canonical workflow guidance.
    - Prefer minimal reusable responsibilities and avoid importing Movie Match stack-specific rules.
  tasks:
    - Include concrete validation with implementation tasks; publication, acceptance, and archive are untracked follow-up gates.
