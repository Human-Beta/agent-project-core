schema: spec-driven
context: |
  Language: English. Write all artifacts in English.
  agent-project-core is a standalone, stack-independent foundation for agent-assisted development across projects.
  This repository owns shared guidance, reusable skills, native Codex/Claude adapters, and a bounded way to export them for project templates.
  The initial core change excludes stack templates, automated update PRs, adoption in existing applications, and real deployment.
  The initial 0.1.0 core change is accepted and archived; guidance, skills, native adapters, and the exporter are implemented.
  Accepted behavior is maintained in openspec/specs/agent-delivery and openspec/specs/core-distribution; change artifacts are preserved under openspec/changes/archive.
  Use the pinned local CLI through pnpm exec openspec. Run pnpm verify before publishing a planning batch.
rules:
  proposal:
    - Separate the repository bootstrap from the proposed reusable core; do not claim planned behavior exists.
  design:
    - Ground tool adapters in official documentation and keep native syntax separate from canonical workflow guidance.
    - Prefer minimal reusable responsibilities and keep application-specific stack rules out of the shared core.
  tasks:
    - Include concrete validation with implementation tasks; publication, acceptance, and archive are untracked follow-up gates.
